name: PR Build & Test

on:
  pull_request:
    branches: [develop]
    paths: ['src/**', 'tests/**']

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Same reason as release.yml: wwwroot is gitignored, so the Angular UI has to be built
      # before dotnet or TradingEngine.Web's EnsureAngularCurrent target fails the build.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      # See release.yml: the lockfile was resolved with --legacy-peer-deps.
      - run: npm ci --legacy-peer-deps
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --collect:"XPlat Code Coverage"
      - uses: codecov/codecov-action@v5

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - run: dotnet restore
      - run: dotnet format --verify-no-changes
